<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorenzo Garbelli — Portfolio</title>
  <meta name="description" content="Portfolio personale di Lorenzo Garbelli: progetti, competenze e contatti.">
  <link rel="canonical" href="https://garbellilorenzo.github.io/">

  <!-- Anteprima per LinkedIn, WhatsApp, Facebook ecc. (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garbellilorenzo.github.io/">
  <meta property="og:title" content="Lorenzo Garbelli — Portfolio">
  <meta property="og:description" content="Studente di Bioinformatica all'Università di Verona. Progetti di software, machine learning e dati.">
  <meta property="og:image" content="https://garbellilorenzo.github.io/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta property="og:image:alt" content="Lorenzo Garbelli — Studente di Bioinformatica · Data & AI">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Vai al contenuto</a>

  <header class="nav">
    <div class="container nav__inner">
      <a href="#top" class="logo" data-bind="initials">LG</a>
      <nav aria-label="Navigazione principale">
        <ul class="nav__links">
          <li><a href="#about">Chi sono</a></li>
          <li><a href="#projects">Progetti</a></li>
          <li><a href="#experience">Percorso</a></li>
          <li><a href="#contact">Contatti</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Cambia tema">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero container" id="top">
      <p class="badge" data-bind="available" hidden><span class="dot"></span>Disponibile per collaborazioni</p>
      <h1 class="hero__title"><span data-bind="name">Lorenzo Garbelli</span></h1>
      <p class="hero__role" data-bind="role"></p>
      <p class="hero__tagline" data-bind="tagline"></p>
      <div class="hero__cta">
        <a class="btn btn--primary" href="#projects">Guarda i progetti</a>
        <a class="btn" href="#contact">Contattami</a>
      </div>
    </section>

    <section class="section container reveal" id="about">
      <h2 class="section__title"><span class="num">01</span>Chi sono</h2>
      <div class="about">
        <div class="about__text" data-bind="about"></div>
        <div class="skills" data-bind="skills"></div>
      </div>
    </section>

    <section class="section container reveal" id="projects">
      <h2 class="section__title"><span class="num">02</span>Progetti</h2>
      <div class="projects" data-bind="projects"></div>
    </section>

    <section class="section container reveal" id="experience">
      <h2 class="section__title"><span class="num">03</span>Percorso</h2>
      <ol class="timeline" data-bind="experience"></ol>
    </section>

    <section class="section container reveal" id="contact">
      <h2 class="section__title"><span class="num">04</span>Contatti</h2>
      <div class="contact">
        <p class="contact__text" data-bind="contact-text"></p>
        <button class="contact__email" type="button" data-bind="email">Mostra email</button>
        <ul class="contact__links" data-bind="links"></ul>
      </div>
    </section>
  </main>

  <footer class="footer container">
    <p>© <span data-bind="year"></span> <span data-bind="name"></span></p>
    <a href="#top">Torna su ↑</a>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
